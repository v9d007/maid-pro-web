<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00332d" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#brandGradient)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.25" />
  
  <!-- Centered Bold "MP" Wordmark -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="240" letter-spacing="-8" text-anchor="middle">
    <!-- "M" in pure white -->
    <text x="180" y="340" fill="#ffffff">M</text>
    <!-- "P" in amber gold -->
    <text x="320" y="340" fill="#f59e0b">P</text>
  </g>
  
  <!-- Accent Amber Dot / Sparkle -->
  <circle cx="400" cy="330" r="28" fill="#f59e0b" filter="url(#amberGlow)" />
</svg>