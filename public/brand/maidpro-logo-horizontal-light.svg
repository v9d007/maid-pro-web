<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160">
  <defs>
    <linearGradient id="iconBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004842" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect width="140" height="140" rx="36" fill="url(#iconBgLight)" />
    
    <!-- Roof & Sparkle -->
    <path d="M42 62 L70 40 L98 62" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="30" r="3.5" fill="#fef08a" />
    <circle cx="54" cy="40" r="2.5" fill="#fef08a" />
    <circle cx="86" cy="40" r="2.5" fill="#fef08a" />

    <!-- MP Letters -->
    <text x="40" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff">M</text>
    <text x="78" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#goldGradL)">P</text>
    <circle cx="116" cy="103" r="6" fill="url(#goldGradL)" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(180, 20)">
    <!-- Brand Wordmark -->
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#004842">Maid</tspan>
      <tspan fill="url(#goldGradL)">Pro</tspan>
    </text>
    <!-- Accent Dot -->
    <circle cx="282" cy="62" r="7" fill="#d97706" />

    <!-- Tagline Subtitle -->
    <text x="2" y="108" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#0f766e" letter-spacing="3" text-transform="uppercase">
      DOMESTIC HELP &amp; DEEP CLEANING • AGRA
    </text>

    <!-- Trust Pill -->
    <rect x="2" y="120" width="170" height="20" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
    <text x="87" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#047857" text-anchor="middle">
      ✓ 100% POLICE VERIFIED
    </text>
  </g>
</svg>
