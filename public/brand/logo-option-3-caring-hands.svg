<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="handsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005c55" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Logomark: Caring Hands, Roof & Heart -->
  <g transform="translate(10, 10)">
    <!-- Roof Peak -->
    <path d="M 24 52 L 64 22 L 104 52" fill="none" stroke="#004842" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 88 34 V 24 H 98 V 42" fill="#004842" />

    <!-- Two Caring Hands forming Heart Base -->
    <path d="M 22 96 C 20 74, 46 64, 64 82 C 82 64, 108 74, 106 96 C 104 116, 64 126, 64 126 C 64 126, 24 116, 22 96 Z" 
          fill="none" stroke="url(#handsGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Golden Star of Care -->
    <polygon points="64,68 67,76 75,76 69,81 71,89 64,84 57,89 59,81 53,76 61,76" fill="url(#warmSun)" />

    <!-- Organic Leaf Wings -->
    <path d="M 14 74 C 6 60, 20 54, 26 62 Z" fill="#2dd4bf" opacity="0.8" />
    <path d="M 114 74 C 122 60, 108 54, 102 62 Z" fill="#2dd4bf" opacity="0.8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(145, 14)">
    <text x="0" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1">
      <tspan fill="#004842">Maid</tspan>
      <tspan fill="#d97706">Pro</tspan>
    </text>
    <circle cx="266" cy="58" r="6" fill="#f59e0b" />

    <text x="2" y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#0f766e" letter-spacing="3" text-transform="uppercase">
      DOMESTIC ASSISTANCE &amp; CARE • AGRA
    </text>

    <rect x="2" y="108" width="168" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="86" y="121" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#92400e" text-anchor="middle">
      ❤️ LOVING FAMILY CARE
    </text>
  </g>
</svg>
