<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="emeraldBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#005c55" />
      <stop offset="60%" stop-color="#004842" />
      <stop offset="100%" stop-color="#002b27" />
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#emeraldBg)" />
  <circle cx="540" cy="540" r="480" fill="none" stroke="url(#ringGlow)" stroke-width="4" stroke-dasharray="12 12" opacity="0.5" />

  <g text-anchor="middle">
    <!-- Main "maidpro" in Lowercase (US style), White + Amber Orange, No Dot (width = 700px) -->
    <text x="540" y="555" font-family="'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="172" textLength="700" lengthAdjust="spacing">
      <tspan fill="#ffffff">maid</tspan><tspan fill="#f59e0b">pro</tspan>
    </text>

    <!-- Subtitle: SOLUTION FOR YOU covering the EXACT SAME WIDTH (700px) -->
    <text x="540" y="625" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="34" fill="#fde68a" textLength="700" lengthAdjust="spacing">
      SOLUTION FOR YOU
    </text>
  </g>
</svg>
