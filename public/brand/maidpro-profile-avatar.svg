<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b26" />
      <stop offset="50%" stop-color="#004842" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <linearGradient id="avatarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="250" fill="url(#avatarBg)" />
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#avatarGold)" stroke-width="6" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Center Roofline & Sparkle Motif -->
  <g filter="url(#avatarGlow)">
    <!-- Roof Peak -->
    <path d="M166 210 L256 138 L346 210" fill="none" stroke="url(#avatarGold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chimney -->
    <path d="M306 178 V148 H328 V196" fill="none" stroke="url(#avatarGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Window Grid -->
    <rect x="242" y="174" width="12" height="12" fill="url(#avatarGold)" rx="2" />
    <rect x="258" y="174" width="12" height="12" fill="url(#avatarGold)" rx="2" />
    <rect x="242" y="190" width="12" height="12" fill="url(#avatarGold)" rx="2" />
    <rect x="258" y="190" width="12" height="12" fill="url(#avatarGold)" rx="2" />
    <!-- Stars -->
    <circle cx="256" cy="100" r="7" fill="#fef08a" />
    <circle cx="198" cy="130" r="5" fill="#fef08a" />
    <circle cx="314" cy="120" r="6" fill="#fef08a" />
  </g>

  <!-- Centered Bold "MP" -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" letter-spacing="-4">
    <text x="175" y="340" fill="#ffffff">M</text>
    <text x="280" y="340" fill="url(#avatarGold)">P</text>
    <circle cx="380" cy="330" r="16" fill="url(#avatarGold)" filter="url(#avatarGlow)" />
  </g>

  <!-- Brand Wordmark Below -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5" text-anchor="middle">
    <tspan fill="#ffffff">Maid</tspan>
    <tspan fill="url(#avatarGold)">Pro</tspan>
  </text>

  <!-- Agra Subtitle -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#5eead4" letter-spacing="4" text-anchor="middle">
    AGRA • VERIFIED
  </text>
</svg>
