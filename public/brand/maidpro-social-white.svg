<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="whiteBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#whiteBg)" />
  <circle cx="540" cy="540" r="480" fill="none" stroke="#e2e8f0" stroke-width="4" />

  <g text-anchor="middle">
    <!-- Main "maidpro" in Lowercase (US style), Forest Green + Amber Orange, No Dot (width = 700px) -->
