      <tspan fill="#004842">maid</tspan><tspan fill="#d97708">pro</tspan>
    </text>

    <!-- Subtitle: SOLUTION FOR YOU covering the EXACT SAME WIDTH (700px) -->
    <text x="540" y="625" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="34" fill="#565e74" textLength="700" lengthAdjust="spacing">
      SOLUTION FOR YOU
    </text>
  </g>
