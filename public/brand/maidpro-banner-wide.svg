<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="wideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002420" />
      <stop offset="40%" stop-color="#003e38" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <linearGradient id="goldWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="wideGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1500" height="500" fill="url(#wideBg)" />

  <!-- Subtle Geometric Hex Pattern Overlay -->
  <g stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.12" fill="none">
    <polygon points="1200,80 1260,115 1260,185 1200,220 1140,185 1140,115" />
    <polygon points="1320,150 1380,185 1380,255 1320,290 1260,255 1260,185" />
    <polygon points="1200,220 1260,255 1260,325 1200,360 1140,325 1140,255" />
    <polygon points="1320,290 1380,325 1380,395 1320,430 1260,395 1260,325" />
    <polygon points="1080,150 1140,185 1140,255 1080,290 1020,255 1020,185" />
    <polygon points="1440,80 1500,115 1500,185 1440,220 1380,185 1380,115" />
  </g>

  <!-- Ambient Light Circles -->
  <circle cx="200" cy="100" r="300" fill="#0f766e" opacity="0.25" filter="blur(60px)" />
  <circle cx="1300" cy="300" r="250" fill="#f59e0b" opacity="0.12" filter="blur(50px)" />

  <!-- Left Content Block -->
  <g transform="translate(100, 70)">
    
    <!-- Solution for you Badge -->
    <rect width="280" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="140" y="22" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ecfdf5" text-anchor="middle" letter-spacing="1">
      ★ SOLUTION FOR YOU • 100% VERIFIED
    </text>

    <!-- Brand Header: Lowercase maidpro with matching full-width subtext -->
    <text x="0" y="105" font-family="'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" textLength="340" lengthAdjust="spacing">
      <tspan fill="#ffffff">maid</tspan><tspan fill="#f59e0b">pro</tspan>
    </text>
    <text x="0" y="132" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="16" fill="#fde68a" textLength="340" lengthAdjust="spacing">
      SOLUTION FOR YOU
    </text>

    <!-- Slogan Headline -->
    <text x="2" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5">
      Agra's Most Trusted Domestic Help &amp; Deep Cleaning Platform
    </text>

    <!-- Subtitle Line -->
    <text x="2" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="19" fill="#99f6e4">
      Daily Maids • Full Deep Cleaning • Cooks • Babysitters • Elderly Care
    </text>

    <!-- Service Feature Pills -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#2dd4bf" stroke-width="1" />
      <text x="90" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">🧹 Daily Maid Chores</text>

      <rect x="195" y="0" width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#2dd4bf" stroke-width="1" />
      <text x="285" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">✨ Deep Cleaning</text>

      <rect x="390" y="0" width="170" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#2dd4bf" stroke-width="1" />
      <text x="475" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">🍳 Homely Cook</text>

      <rect x="575" y="0" width="190" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#2dd4bf" stroke-width="1" />
      <text x="670" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">👶 Nanny &amp; Patient Care</text>
    </g>

    <!-- Bottom Contact Strip -->
    <g transform="translate(0, 310)">
      <rect width="640" height="54" rx="14" fill="url(#goldWide)" filter="url(#wideGlow)" />
      <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#0f172a">
        📞 Call / WhatsApp: +91 93210 34262
      </text>
      <text x="440" y="33" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#064e3b">
        • Bodla &amp; Khandari, Agra
      </text>
    </g>

  </g>

  <!-- Sparkle Elements Right -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="1080" cy="100" r="4" />
    <circle cx="1200" cy="60" r="3" />
    <circle cx="1380" cy="180" r="5" />
    <circle cx="1160" cy="420" r="4" />
  </g>
</svg>
