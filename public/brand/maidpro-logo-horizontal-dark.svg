<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160">
  <defs>
    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003833" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="goldGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect width="140" height="140" rx="36" fill="url(#iconBg)" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Roof & Sparkle -->
    <path d="M42 62 L70 40 L98 62" fill="none" stroke="url(#goldGradH)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="30" r="3.5" fill="#fef08a" />
    <circle cx="54" cy="40" r="2.5" fill="#fef08a" />
    <circle cx="86" cy="40" r="2.5" fill="#fef08a" />

    <!-- MP Letters -->
    <text x="40" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff">M</text>
    <text x="78" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#goldGradH)">P</text>
    <circle cx="116" cy="103" r="6" fill="url(#goldGradH)" filter="url(#goldGlowH)" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(180, 20)">
    <!-- Brand Wordmark -->
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#ffffff">Maid</tspan>
      <tspan fill="url(#goldGradH)">Pro</tspan>
    </text>
    <!-- Accent Dot -->
    <circle cx="282" cy="62" r="7" fill="url(#goldGradH)" filter="url(#goldGlowH)" />

    <!-- Tagline Subtitle -->
    <text x="2" y="108" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#5eead4" letter-spacing="3" text-transform="uppercase">
      DOMESTIC HELP &amp; DEEP CLEANING • AGRA
    </text>

    <!-- Trust Pill -->
    <rect x="2" y="120" width="170" height="20" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="87" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#ecfdf5" text-anchor="middle">
      ✓ 100% POLICE VERIFIED
    </text>
  </g>
</svg>
