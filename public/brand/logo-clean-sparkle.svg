<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emeraldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <g transform="translate(30, 20)">
    <!-- Brand Wordmark 'maidpro' -->
    <text x="0" y="65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="68" letter-spacing="-1.2">
      <tspan fill="#1e293b">ma</tspan>
      <!-- 'i' stem without dot -->
      <tspan fill="#1e293b">ı</tspan>
      <tspan fill="#1e293b">dpro</tspan>
    </text>

    <!-- Custom 4-Point Star Sparkle replacing 'i' dot -->
    <!-- Positioned precisely over the 'i' stem at x=78, y=14 -->
    <path d="M78 0 Q78 14 92 14 Q78 14 78 28 Q78 14 64 14 Q78 14 78 0 Z" fill="url(#emeraldSpark)" />
    <!-- Center white highlight -->
    <circle cx="78" cy="14" r="2.2" fill="#ffffff" />

    <!-- Subtitle: PREMIER CLEANING SERVICES -->
    <text x="2" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#475569" letter-spacing="4">
      PREMIER CLEANING SERVICES
    </text>
  </g>
</svg>
