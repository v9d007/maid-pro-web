<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#005c55" />
      <stop offset="60%" stop-color="#003833" />
      <stop offset="100%" stop-color="#002420" />
    </radialGradient>
    <pattern id="dotPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#f59e0b" opacity="0.15" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bannerBg)" />
  <rect width="1200" height="630" fill="url(#dotPattern)" />

  <g transform="translate(100, 110)">
    <!-- Top Pill Tag -->
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#002b27" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="130" y="22" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12" fill="#fbbf24" letter-spacing="2" text-anchor="middle">
      100% POLICE VERIFIED
    </text>

    <!-- Main Pure Text Brandmark: maidpro with matching full-width subtext -->
    <text x="0" y="140" font-family="'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="112" textLength="470" lengthAdjust="spacing">
      <tspan fill="#ffffff">maid</tspan><tspan fill="#f59e0b">pro</tspan>
    </text>

    <!-- Subtext 'SOLUTION FOR YOU' covering EXACT SAME WIDTH (470px) -->
    <text x="0" y="176" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="23" fill="#fbbf24" textLength="470" lengthAdjust="spacing">
      SOLUTION FOR YOU
    </text>

    <text x="0" y="220" font-family="'Lexend', system-ui, sans-serif" font-weight="600" font-size="26" fill="#e2e8f0" letter-spacing="-0.5">
      Verified Domestic Staff &amp; Deep House Cleaning in Agra
    </text>

    <text x="0" y="240" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="18" fill="#cbd5e1">
      Housemaids • Home Cooks • Babysitters • Elderly Caregivers • 24-Hour Live-in Staff
    </text>

    <!-- 3 Key Trust Pillars (Pills) -->
    <g transform="translate(0, 280)">
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="21" fill="#004842" stroke="#f59e0b" stroke-width="1.5" />
        <text x="105" y="26" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
          ✓ 100% Police Verified
        </text>
      </g>

      <g transform="translate(230, 0)">
        <rect width="220" height="42" rx="21" fill="#004842" stroke="#f59e0b" stroke-width="1.5" />
        <text x="110" y="26" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
          ✓ Free Instant Replacement
        </text>
      </g>

      <g transform="translate(470, 0)">
        <rect width="200" height="42" rx="21" fill="#004842" stroke="#f59e0b" stroke-width="1.5" />
        <text x="100" y="26" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
          ✓ Transparent Salary
        </text>
      </g>
    </g>

    <!-- Bottom Contact Strip -->
    <g transform="translate(0, 370)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#005c55" stroke-width="1.5" />
      <text x="0" y="32" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f59e0b">
        📞 9321034262  •  🌐 maidprosolution4you.in
      </text>
      <text x="1000" y="32" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#cbd5e1" text-anchor="end">
        Serving Dayalbagh, Khandari, Kamla Nagar, Sanjay Place &amp; all Agra
      </text>
    </g>

  </g>
</svg>
