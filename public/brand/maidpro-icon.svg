<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b26" />
      <stop offset="50%" stop-color="#004842" />
      <stop offset="100%" stop-color="#005c55" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ca8a04" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Background -->
  <rect width="512" height="512" rx="116" fill="url(#favBg)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center House Emblem with Sparkles -->
  <g transform="translate(46, 26)">
    <!-- Golden House Frame -->
    <g stroke="url(#favGold)" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#favGlow)">
      <!-- Chimney on left slope -->
      <path d="M 124 165 V 95 H 158 V 126" stroke-width="18" />
      <!-- Roof Peak & Slopes -->
      <path d="M 54 206 L 210 76 L 366 206" stroke-width="24" />
      <!-- House Body Walls & Floor -->
      <path d="M 80 196 V 342 H 148" stroke-width="20" />
      <path d="M 340 196 V 342 H 220" stroke-width="20" />
    </g>

    <!-- Large Central 4-Point Sparkle Star inside House -->
    <path d="M 210 180 Q 210 256 286 256 Q 210 256 210 332 Q 210 256 134 256 Q 210 256 210 180 Z" fill="#ffffff" filter="url(#favGlow)" />
    <circle cx="210" cy="256" r="10" fill="#fde047" />

    <!-- Accent Rooftop Sparkle Stars -->
    <path d="M 310 40 Q 310 70 340 70 Q 310 70 310 100 Q 310 70 280 70 Q 310 70 310 40 Z" fill="url(#favGold)" filter="url(#favGlow)" />
    <circle cx="254" cy="36" r="8" fill="#fef08a" />
  </g>

  <!-- Wordmark "MaidPro" at Bottom of App Icon -->
  <text x="256" y="446" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1" text-anchor="middle">
    <tspan fill="#ffffff">Maid</tspan>
    <tspan fill="url(#favGold)">Pro</tspan>
  </text>
</svg>