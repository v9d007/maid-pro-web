<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconEmeraldBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#005c55" />
      <stop offset="65%" stop-color="#004842" />
      <stop offset="100%" stop-color="#002b27" />
    </radialGradient>
    <linearGradient id="iconAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#iconEmeraldBg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.25" />

  <!-- Pure Text Monogram: lowercase "mp", No Dot, White + Amber Orange -->
  <g text-anchor="middle">
    <text x="256" y="325" font-family="'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="220" letter-spacing="-8">
      <tspan fill="#ffffff">m</tspan><tspan fill="url(#iconAmber)">p</tspan>
    </text>
  </g>
</svg>