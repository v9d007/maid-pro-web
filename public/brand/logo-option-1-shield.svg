<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004842" />
      <stop offset="100%" stop-color="#006b63" />
    </linearGradient>
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="opt1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Logomark: The Sparkle Shield -->
  <g transform="translate(10, 8)">
    <!-- House & Shield Outer Frame -->
    <path d="M 60 16 L 108 52 L 108 88 C 108 108, 60 126, 60 126 C 60 126, 12 108, 12 88 L 12 52 Z" 
          fill="url(#shieldGrad)" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Chimney Accent -->
    <path d="M 86 36 L 86 24 L 98 24 L 98 44" fill="url(#shieldGrad)" />
    
    <!-- Sweeping Orbit Ring -->
    <path d="M 6 86 C 14 66, 92 64, 114 74" fill="none" stroke="url(#goldSparkle)" stroke-width="5" stroke-linecap="round" />

    <!-- Central 4-Point Gold Diamond Star -->
    <path d="M 60 44 Q 60 62 76 62 Q 60 62 60 80 Q 60 62 44 62 Q 60 62 60 44 Z" fill="url(#goldSparkle)" filter="url(#opt1Glow)" />
    
    <!-- Window Grid Dots -->
    <circle cx="54" cy="96" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="66" cy="96" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(145, 14)">
    <text x="0" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1">
      <tspan fill="#004842" class="brand-text-dark">Maid</tspan>
      <tspan fill="url(#goldSparkle)">Pro</tspan>
    </text>
    <!-- Modern Brand Dot -->
    <circle cx="266" cy="58" r="6" fill="#f59e0b" />

    <!-- Subtitle -->
    <text x="2" y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#0f766e" letter-spacing="3" text-transform="uppercase">
      DOMESTIC HELP &amp; CLEANING • AGRA
    </text>

    <!-- Verified Tag -->
    <rect x="2" y="108" width="162" height="18" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
    <text x="83" y="121" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#047857" text-anchor="middle">
      🛡️ 100% POLICE VERIFIED
    </text>
  </g>
</svg>
