<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Droplet & Clean Arc Icon -->
  <g transform="translate(20, 16)">
    <!-- Droplet Body -->
    <path d="M48 10 C48 10 20 48 20 68 C20 84 32 96 48 96 C64 96 76 84 76 68 C76 48 48 10 48 10 Z" fill="url(#dropGrad)" />
    <!-- Inner Leaf / Shine Curve -->
    <path d="M48 24 C48 24 32 50 32 68 C32 76 38 84 48 84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <!-- Dynamic Orbit Swoosh -->
    <path d="M12 70 C16 92 68 104 88 78" stroke="#004842" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- 4-point sparkle top right -->
    <path d="M78 16 Q78 24 86 24 Q78 24 78 32 Q78 24 70 24 Q78 24 78 16 Z" fill="#2dd4bf" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(135, 20)">
    <text x="0" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.2">
      <tspan fill="#004842">maid</tspan>
      <tspan fill="#0ea5e9">pro</tspan>
    </text>
    <text x="3" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="3">
      VERIFIED DOMESTIC SERVICES • AGRA
    </text>
  </g>
</svg>
